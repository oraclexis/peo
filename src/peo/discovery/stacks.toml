# Discovery tables (spec 12, sections 2.1 to 2.3). Order is significant: it is the output order.

# Ecosystems, in the order of spec 12 table 2.1. `binary` is the main binary (spec 12 §2.3).
[[ecosystem]]
id = "node"
manifests = ["package.json"]
binary = "node"

[[ecosystem]]
id = "php"
manifests = ["composer.json"]
binary = "php"

[[ecosystem]]
id = "python"
manifests = ["pyproject.toml", "requirements*.txt"]
binary = "python3"

[[ecosystem]]
id = "go"
manifests = ["go.mod"]
binary = "go"

[[ecosystem]]
id = "rust"
manifests = ["Cargo.toml"]
binary = "cargo"

[[ecosystem]]
id = "jvm"
manifests = ["pom.xml", "build.gradle", "build.gradle.kts"]
binary = "java"

[[ecosystem]]
id = "ruby"
manifests = ["Gemfile"]
binary = "ruby"

# Languages, in the order of spec 12 §2.2 rule 7. Extension order is the paths.code order.
[[language]]
id = "typescript"
extensions = ["vue", "ts", "tsx"]

[[language]]
id = "javascript"
extensions = ["js", "jsx", "mjs", "cjs"]

[[language]]
id = "css"
extensions = ["css", "scss"]

[[language]]
id = "php"
extensions = ["php"]

[[language]]
id = "python"
extensions = ["py"]

[[language]]
id = "go"
extensions = ["go"]

[[language]]
id = "rust"
extensions = ["rs"]

[[language]]
id = "java"
extensions = ["java"]

[[language]]
id = "kotlin"
extensions = ["kt", "kts"]

[[language]]
id = "ruby"
extensions = ["rb"]

# Stacks, in the order of spec 12 table 2.1. A package ending with "*" is a prefix.
# versioned: framework stacks only (spec 12 §2.1). role: render or server (spec 12 §2.2 rule 8).
# manifest_only: present as soon as the manifest exists.

[[stack]]
id = "nuxt"
ecosystem = "node"
packages = ["nuxt"]
versioned = true
role = "render"

