# Provisional detection rules (spec 12 §7 ter): the [detect] rules of the initial catalog
# (spec 13 §5), limited to what can be read in the repository. Replaced by the fiches in R4.
# `ci`: tokens X-NO-SECRET-SCAN looks for in CI files (spec 15 §7.1 bis); Discovery ignores it.

[[tool]]
ref = "cli:playwright"
npm = ["@playwright/test", "playwright"]

[[tool]]
ref = "framework:spec-kit"
files = [".specify/init-options.json"]

[[tool]]
ref = "ci-check:semgrep"
pip = ["semgrep"]
files = [".semgrep.yml"]

[[tool]]
ref = "ci-check:gitleaks"
files = [".gitleaks.toml"]
ci = ["gitleaks", "Secret-Detection"]

[[tool]]
ref = "mcp:serena"
files = [".serena/project.yml"]
